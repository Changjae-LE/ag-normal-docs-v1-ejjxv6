name: AttriGuard official normal task
concurrency:
  group: attriguard-gitinject-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      ATTRIGUARD_CONFIGURATION: baseline
    steps:
      - name: Enforce isolated benchmark repository
        shell: bash
        env:
          EXPECTED_OWNER: ${{ vars.ATTRIGUARD_BENCHMARK_OWNER }}
          EXPECTED_PREFIX: ${{ vars.ATTRIGUARD_BENCHMARK_PREFIX }}
          EXPECTED_REPOSITORY_ID: ${{ vars.ATTRIGUARD_BENCHMARK_REPOSITORY_ID }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVALUATION_REF: ${{ vars.ATTRIGUARD_EVALUATION_REF }}
        run: |
          set -euo pipefail
          actual_owner="${GITHUB_REPOSITORY%%/*}"
          actual_name="${GITHUB_REPOSITORY#*/}"
          if [[ "${actual_owner}" != "${EXPECTED_OWNER}" ]]; then
            echo "Refusing non-benchmark owner" >&2
            exit 1
          fi
          if [[ "${actual_name}" != "${EXPECTED_PREFIX}"* ]]; then
            echo "Refusing repository outside benchmark prefix" >&2
            exit 1
          fi
          if [[ ! "${EXPECTED_REPOSITORY_ID}" =~ ^[1-9][0-9]*$ ]] ||
             [[ "${EVENT_REPOSITORY_ID}" != "${EXPECTED_REPOSITORY_ID}" ]]; then
            echo "Refusing repository ID not bound by the GitInject provisioner" >&2
            exit 1
          fi
          if [[ ! "${EVALUATION_REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ATTRIGUARD_EVALUATION_REF must be an immutable 40-hex commit" >&2
            exit 1
          fi
      - name: Check out trusted evaluation harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ vars.ATTRIGUARD_EVALUATION_REPOSITORY }}
          ref: ${{ vars.ATTRIGUARD_EVALUATION_REF }}
          path: evaluation
          token: ${{ secrets.ATTRIGUARD_HARNESS_READ_TOKEN }}
          persist-credentials: false
      - name: Stage pinned normal adapter 1
        shell: bash
        run: |
          printf '%s' '' > "${RUNNER_TEMP}/attriguard-normal-overlay.b64"
      - name: Stage pinned normal adapter 2
        shell: bash
        run: |
          printf '%s' '' >> "${RUNNER_TEMP}/attriguard-normal-overlay.b64"
      - name: Stage pinned normal adapter 3
        shell: bash
        run: |
          printf '%s' '' >> "${RUNNER_TEMP}/attriguard-normal-overlay.b64"
      - name: Stage pinned normal adapter 4
        shell: bash
        run: |
          printf '%s' '' >> "${RUNNER_TEMP}/attriguard-normal-overlay.b64"
      - name: Stage pinned normal adapter 5
        shell: bash
        run: |
          printf '%s' '' >> "${RUNNER_TEMP}/attriguard-normal-overlay.b64"
      - name: Stage pinned normal adapter 6
        shell: bash
        run: |
          printf '%s' '' >> "${RUNNER_TEMP}/attriguard-normal-overlay.b64"
      - name: Stage pinned normal adapter 7
        shell: bash
        run: |
          printf '%s' '' >> "${RUNNER_TEMP}/attriguard-normal-overlay.b64"
      - name: Stage pinned normal adapter 8
        shell: bash
        run: |
          printf '%s' '' >> "${RUNNER_TEMP}/attriguard-normal-overlay.b64"
      - name: Stage pinned normal adapter 9
        shell: bash
        run: |
          printf '%s' '' >> "${RUNNER_TEMP}/attriguard-normal-overlay.b64"
      - name: Stage pinned normal adapter 10
        shell: bash
        run: |
          printf '%s' '' >> "${RUNNER_TEMP}/attriguard-normal-overlay.b64"
      - name: Stage pinned normal adapter 11
        shell: bash
        run: |
          printf '%s' '' >> "${RUNNER_TEMP}/attriguard-normal-overlay.b64"
      - name: Install and verify pinned normal adapter
        shell: bash
        run: |
          python - <<'PY'
          """Apply a hash-bound local adapter to an unchanged, pinned trusted checkout."""
          import base64
          import gzip
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import subprocess


          def apply_overlay(root, encoded, expected_sha256):
              root = Path(root).resolve(strict=True)
              compressed = base64.b64decode(encoded, validate=True)
              if hashlib.sha256(compressed).hexdigest() != expected_sha256:
                  raise ValueError("Trusted adapter archive hash mismatch")
              payload = json.loads(gzip.decompress(compressed))
              if payload.get("protocol") != "pinned_benign_adapter_overlay_v1":
                  raise ValueError("Unexpected adapter protocol")
              commit = subprocess.run(["git", "rev-parse", "HEAD"], cwd=root, check=True,
                                      capture_output=True, text=True).stdout.strip()
              if commit != payload["base_ref"]:
                  raise ValueError("Trusted base checkout differs")
              marker = root / ".trusted_benign_overlay.json"
              if marker.exists():
                  raise ValueError("Trusted adapter already installed")
              files = payload["files"]
              if not isinstance(files, dict) or not files or len(files) > 40:
                  raise ValueError("Unexpected adapter file inventory")
              pending = []
              for name, record in files.items():
                  relative = PurePosixPath(name)
                  if relative.is_absolute() or ".." in relative.parts or ".git" in relative.parts or "\\" in name:
                      raise ValueError("Adapter path is not permitted")
                  raw_target = root.joinpath(*relative.parts)
                  target = raw_target.resolve()
                  if not target.is_relative_to(root) or raw_target.is_symlink():
                      raise ValueError("Adapter path escapes the trusted checkout")
                  before = record["base_sha256"]
                  if before is None:
                      if target.exists():
                          raise ValueError("New adapter path already exists: " + name)
                  elif not target.is_file() or hashlib.sha256(target.read_bytes()).hexdigest() != before:
                      raise ValueError("Base file differs: " + name)
                  data = base64.b64decode(record["data"], validate=True)
                  if hashlib.sha256(data).hexdigest() != record["sha256"]:
                      raise ValueError("Adapter file hash mismatch: " + name)
                  pending.append((target, data))
              # Validate the complete archive before changing any checkout file.
              for target, data in pending:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  temporary = target.with_name(target.name + ".adapter-pending")
                  with temporary.open("xb") as stream:
                      stream.write(data)
                  os.replace(temporary, target)
              provenance = {"protocol": payload["protocol"], "base_ref": commit,
                            "overlay_sha256": expected_sha256,
                            "files": {name: record["sha256"] for name, record in files.items()}}
              with marker.open("x", encoding="utf-8") as stream:
                  json.dump(provenance, stream, sort_keys=True, indent=2)
                  stream.write("\n")
              return provenance

          encoded = (Path(os.environ['RUNNER_TEMP']) / 'attriguard-normal-overlay.b64').read_text()
          apply_overlay('evaluation', encoded, '178fa281ef8422b4729a36038bce2a4ac9a900da51f3c7235dff1236adb87d88')
          PY
      - name: Check out untrusted pull request as data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Set up AttriGuard Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: evaluation/pyproject.toml
      - name: Install trusted evaluation harness
        shell: bash
        run: python -m pip install --disable-pip-version-check ./evaluation
      - name: Fetch and verify official AttriGuard artifact
        shell: bash
        env:
          ATTRIGUARD_ARTIFACT_ROOT: ${{ runner.temp }}/attriguard-official
        run: python evaluation/scripts/fetch_attriguard_artifact.py --destination "${ATTRIGUARD_ARTIFACT_ROOT}"
      - name: Verify all normal adapters with official core before model calls
        shell: bash
        env:
          ATTRIGUARD_ARTIFACT_ROOT: ${{ runner.temp }}/attriguard-official
        run: python -m unittest discover -s evaluation/tests -p test_normal_tasks.py -v
      - name: Run AttriGuard GitInject reviewer
        shell: bash
        env:
          ATTRIGUARD_ARTIFACT_ROOT: ${{ runner.temp }}/attriguard-official
          ATTRIGUARD_RECEIPT: ${{ runner.temp }}/attriguard-evidence/trial.json
          ATTRIGUARD_GITINJECT_SCENARIO: ${{ vars.ATTRIGUARD_GITINJECT_SCENARIO }}
          ATTRIGUARD_EXPOSURE_MODE: ${{ vars.ATTRIGUARD_EXPOSURE_MODE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          ATTRIGUARD_TRUSTED_OVERLAY_SHA256: 178fa281ef8422b4729a36038bce2a4ac9a900da51f3c7235dff1236adb87d88
        run: python evaluation/scripts/run_gitinject_github_action.py --execute-live --exposure-mode "${ATTRIGUARD_EXPOSURE_MODE:-natural}" --configuration "${ATTRIGUARD_CONFIGURATION}" --scenario "${ATTRIGUARD_GITINJECT_SCENARIO}" --repository-root "${GITHUB_WORKSPACE}/target" --event-path "${GITHUB_EVENT_PATH}" --artifact-root "${ATTRIGUARD_ARTIFACT_ROOT}" --target-model "${{ vars.ATTRIGUARD_TARGET_MODEL }}" --auxiliary-model "${{ vars.ATTRIGUARD_AUXILIARY_MODEL }}" --expected-owner "${{ vars.ATTRIGUARD_BENCHMARK_OWNER }}" --expected-prefix "${{ vars.ATTRIGUARD_BENCHMARK_PREFIX }}" --expected-repository-id "${{ vars.ATTRIGUARD_BENCHMARK_REPOSITORY_ID }}" --output "${ATTRIGUARD_RECEIPT}"
      - name: Validate local trial evidence
        if: always()
        shell: bash
        env:
          ATTRIGUARD_ARTIFACT_ROOT: ${{ runner.temp }}/attriguard-official
          ATTRIGUARD_RECEIPT: ${{ runner.temp }}/attriguard-evidence/trial.json
          ATTRIGUARD_VALIDITY: ${{ runner.temp }}/attriguard-evidence/validity.json
        run: python evaluation/scripts/validate_attriguard_gitinject_trials.py --trial "${ATTRIGUARD_RECEIPT}" --artifact-root "${ATTRIGUARD_ARTIFACT_ROOT}" --output "${ATTRIGUARD_VALIDITY}"
      - name: Upload local evidence separately
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: attriguard-gitinject-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/attriguard-evidence/trial.json
            ${{ runner.temp }}/attriguard-evidence/validity.json
          if-no-files-found: error
          retention-days: 30
'on':
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
